# ======================================================

# Discord Integration Settings
discord:
  token: "YOUR_BOT_TOKEN_HERE"
  channel-id: "YOUR_CHANNEL_ID_HERE"

# Server Identification
server-name: "YOUR_SERVER_NAME_HERE"

# Toggle Discord handler (Enable ONLY on one server in a multi-server setup)
discord-handler: false

# Message Formats & Localization
messages:
  # In-game StaffChat format (%player% = sender name, %message% = chat message)
  staffchat-format: "&8[&bStaffChat&8] &f%player%: &f%message%"
  
  # Error message when a player lacks permission
  no-permission: "&cYou do not have permission to use this command."
  
  # Command usage helper
  usage: "&cUsage: /sc <message>"
  
  # Format for messages sent from Discord into Minecraft (%user% = Discord tag, %message% = Discord message)
  discord-format: "&8[&9Discord&8] &f%user%: &f%message%"
  
  # Format for messages received from other servers (%server% = source server name)
  cross-server-format: "&8[&bStaffChat&8] &8[&7%server%&8] &f%player%: &f%message%"
  
  # Success message after running reload command
  reload-success: "&8[&bStaffChat&8] &aConfiguration successfully reloaded!"